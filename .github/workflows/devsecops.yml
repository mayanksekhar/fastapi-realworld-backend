name: DevSecOps Pipeline

on:
  push:
    branches: [main, master, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fastapi-realworld-devsecops
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ── JOB 1: Secret Scanning ─────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── JOB 2: SAST ────────────────────────────────────────────────────────────
  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners
        run: pip install bandit semgrep

      - name: Bandit
        run: |
          bandit -r conduit/ \
            -f json \
            -o bandit-results.json \
            --exit-zero
          bandit -r conduit/ -f txt

      - name: Semgrep
        run: |
          semgrep scan \
            --config "p/python" \
            --config "p/owasp-top-ten" \
            --config "p/jwt" \
            --json \
            --output semgrep-results.json \
            --error \
            conduit/

      - name: Upload SAST results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-results
          path: |
            bandit-results.json
            semgrep-results.json

  # ── JOB 3: SCA — Dependency CVE Gate ───────────────────────────────────────
  sca:
    name: SCA (Grype + Trivy FS)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Grype — fail on HIGH/CRITICAL
        run: |
          grype dir:. \
            --fail-on high \
            --output json \
            > grype-results.json || true
          grype dir:. \
            --fail-on high \
            --output table

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-fs-results.json
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload SCA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-results
          path: |
            grype-results.json
            trivy-fs-results.json

  # ── JOB 4: Build + Image Scan ──────────────────────────────────────────────
  build-and-scan:
    name: Build + Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [sast, sca]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (no push yet)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan — fail on CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: json
          output: trivy-image-results.json
          severity: CRITICAL
          exit-code: "1"

      - name: Trivy image scan — table (informational)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha

      - name: Upload image scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-scan-results
          path: trivy-image-results.json

  # ── JOB 5: SBOM + Sign + Attest ────────────────────────────────────────────
  sign-and-attest:
    name: SBOM + Cosign Sign + Attest (SLSA Level 2)
    runs-on: ubuntu-latest
    needs: build-and-scan
    permissions:
      contents: read
      packages: write
      id-token: write   # required for keyless Cosign OIDC
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Install Syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (CycloneDX)
        run: |
          syft ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -o cyclonedx-json \
            > sbom.cyclonedx.json

      - name: Sign image (keyless)
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.cyclonedx.json \
            --type cyclonedx \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json

